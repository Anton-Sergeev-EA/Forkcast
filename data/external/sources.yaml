    transform: среднедневное значение за квартал (quarter mean of daily rate)
    source: Банк России
    urls:
      - https://www.cbr.ru/hd_base/KeyRate/
      - https://www.cbr.ru/press/keypr/
      - https://www.cbr.ru/press/pr/?file=24072026_133000key.htm
