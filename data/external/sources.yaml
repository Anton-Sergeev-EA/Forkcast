# Происхождение внешних данных (data lineage). Дата выгрузки: 2026-09-23.
# Статус verification: confirmed — значение подтверждено первичным/официальным источником;
#                      secondary — вторичный источник (СМИ со ссылкой на Росстат/ЦБ);
#                      check — требуется сверка при следующем обновлении (ревизии Росстата).
retrieved_at: "2026-09-23"
indicators:
