# Глобальные настройки Forkcast. Все пути — относительно корня проекта.
paths:
  market_file: data/raw/market_forklifts_2023Q1_2026Q1.xlsx
  external_dir: data/external
  processed_dir: data/processed
  reports_dir: reports
  vintages_dir: forecasts/vintages

forecast:
  short_horizon: 4          # краткосрочный горизонт, кварталов (обязательный)
  long_horizon: 8           # долгосрочный горизонт, кварталов
  n_draws: 4000             # число симуляций Монте-Карло на сценарий
  seed: 20260923            # фиксированный seed => воспроизводимость до знака
  intervals: [0.5, 0.8, 0.95]

model:
  # Эффективная ставка = среднее ключевой ставки за кварталы t-1..t-3
  # (трансмиссия ДКП в инвестиционный спрос занимает 2–4 квартала).
  key_rate_lags: [1, 2, 3]
  # Априорные распределения (N(mean, sd)) — экономически обоснованные, слабоинформативные.
  priors:
    market:
      key_rate: [-0.025, 0.020]     # полуэластичность рынка по ставке, доля/п.п.
      log_investment: [1.5, 1.0]    # эластичность спроса на оборудование к инвестициям
      seasonal: [0.0, 0.30]
    share:
      trend: [0.05, 0.05]           # сдвиг логита доли электро за квартал
      key_rate: [-0.02, 0.03]       # ДВС сильнее реагирует на ставку => знак минус
      seasonal: [0.0, 0.30]
  # Потолок доли электропогрузчиков (насыщение S-кривой). Чувствительность к 0.80–1.00 — в отчёте.
  electric_share_cap: 0.85
  gibbs:
    iterations: 6000
    burn_in: 1000
    thin: 1
  # Сглаживание структуры сегментов внутри блока (ДВС/электро)
  segment_mix:
    halflife_quarters: 3
    trend_damping: 0.8

backtest:
  min_train: 8              # минимальная длина обучающей выборки (кварталов)
  max_horizon: 4
